openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: APZ Legal Practice Management System API
security:
  - sessionCookie: []
  - bearerSession: []
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: clients
    description: Client management
  - name: matters
    description: Matter lifecycle
  - name: documents
    description: Document management
  - name: fica
    description: FICA compliance
  - name: conflicts
    description: Conflict checking
  - name: tasks
    description: Matter tasks
  - name: time
    description: Time tracking
  - name: billing
    description: Billing and invoices
  - name: knowledge
    description: Knowledge base
  - name: templates
    description: Governed legal templates
  - name: ai
    description: AI legal assistant
  - name: audit
    description: Audit logs
  - name: dashboard
    description: Dashboard analytics
  - name: productivity
    description: Firm productivity analytics
  - name: email
    description: Matter-centric email correspondence

paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      security: []
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current session
      responses:
        "200":
          description: Logged out

  /auth/dev-login:
    post:
      security: []
      operationId: devLogin
      tags: [auth]
      summary: Development-only quick sign-in for an allowlisted demo account
      description: Resolves only the repository's explicit demo identities and provisions the selected account when it is absent. This endpoint is for local/demo environments and does not accept arbitrary identities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginInput"
      responses:
        "200":
          description: Authenticated demo session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid demo account selection
        "401":
          description: Demo identity is not allowlisted
        "403":
          description: Existing account does not match the selected demo identity

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid name or email
        "401":
          description: Authentication required

  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid password input
        "401":
          description: Authentication required
        "403":
          description: Current password is incorrect

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── CLIENTS ─────────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [individual, corporate, trust, government]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending]
        - name: ficaStatus
          in: query
          schema:
            type: string
            enum: [compliant, pending, expired, blocked]
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"

    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Archive a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  /clients/{id}/fica:
    get:
      operationId: getClientFica
      tags: [clients, fica]
      summary: Get FICA compliance status for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: FICA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FicaStatus"

  /clients/{id}/risk-score:
    get:
      operationId: getClientRiskScore
      tags: [clients]
      summary: Get risk score for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Risk score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScore"

  # ─── MATTERS ─────────────────────────────────────────────────────────────────
  /matters:
    get:
      operationId: listMatters
      tags: [matters]
      summary: List all matters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [lead, conflict_check, approved, active, review, completed, closed, archived]
        - name: clientId
          in: query
          schema:
            type: integer
        - name: assignedTo
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of matters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Matter"

    post:
      operationId: createMatter
      tags: [matters]
      summary: Create a new matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterInput"
      responses:
        "201":
          description: Matter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"

  /matters/{id}:
    get:
      operationId: getMatter
      tags: [matters]
      summary: Get matter by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"

    patch:
      operationId: updateMatter
      tags: [matters]
      summary: Update a matter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterUpdate"
      responses:
        "200":
          description: Updated matter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"

  /matters/{id}/export:
    get:
      operationId: exportMatter
      tags: [matters]
      summary: Export a matter dossier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matter dossier metadata export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterExport"

  /matters/{id}/assignees:
    get:
      operationId: listMatterAssignees
      tags: [matters]
      summary: List active staff who can be assigned to a matter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eligible matter assignees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatterAssignee"

  /matters/{id}/status:
    patch:
      operationId: updateMatterStatus
      tags: [matters]
      summary: Transition matter status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"

  /matters/{id}/summary:
    get:
      operationId: getMatterSummary
      tags: [matters]
      summary: Get AI-generated matter summary timeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matter summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterSummary"

  /matters/{id}/timeline:
    get:
      operationId: getMatterTimeline
      tags: [matters]
      summary: Consolidated timeline of every event linked to a matter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chronological matter timeline (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatterTimelineEvent"

  # ─── DOCUMENTS ───────────────────────────────────────────────────────────────
  /matters/{matterId}/documents:
    get:
      operationId: listMatterDocuments
      tags: [documents]
      summary: List documents in a matter
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

    post:
      operationId: addMatterDocument
      tags: [documents]
      summary: Create a document in a matter
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}:
    get:
      operationId: getMatterDocument
      tags: [documents]
      summary: Get a document
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

    patch:
      operationId: updateMatterDocument
      tags: [documents]
      summary: Update a document
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents:
    get:
      operationId: listAllDocuments
      tags: [documents]
      summary: List all documents across matters
      responses:
        "200":
          description: Documents list with matter context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/versions:
    get:
      operationId: listDocumentVersions
      tags: [documents]
      summary: Immutable version history for a document
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersion"

  /matters/{matterId}/documents/{id}/status:
    post:
      operationId: changeDocumentStatus
      tags: [documents]
      summary: Draft-phase lifecycle move (draft / ai_assist / review only)
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentStatusChange"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/ai-assist:
    post:
      operationId: applyDocumentAiAssist
      tags: [documents]
      summary: Record AI-generated or AI-assisted content with provenance
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAiAssist"
      responses:
        "200":
          description: AI assistance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/verify-citations:
    post:
      operationId: verifyDocumentCitations
      tags: [documents]
      summary: Record an attorney's verification of citations in a document
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Citations verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/submit:
    post:
      operationId: submitDocumentForApproval
      tags: [documents]
      summary: Submit a document for partner approval
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted; partners notified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/decision:
    post:
      operationId: decideDocumentApproval
      tags: [documents]
      summary: Partner decision on a submitted document
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentDecision"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/send-signature:
    post:
      operationId: sendDocumentForSignature
      tags: [documents]
      summary: Send an approved document to the client for signature
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSignatureRequest"
      responses:
        "200":
          description: Sent for signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/sign:
    post:
      operationId: markDocumentSigned
      tags: [documents]
      summary: Record a verified client signature and sealed evidence
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSignatureInput"
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/archive:
    post:
      operationId: archiveDocument
      tags: [documents]
      summary: Archive a signed document
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /matters/{matterId}/documents/{id}/approve:
    post:
      operationId: approveMatterDocument
      tags: [documents]
      summary: "[Deprecated] Use the submit + decision workflow"
      deprecated: true
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentApproval"
      responses:
        "200":
          description: Document approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Notifications for the current user (direct or role-targeted)
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ─── TASKS ───────────────────────────────────────────────────────────────────
  /matters/{matterId}/tasks:
    get:
      operationId: listMatterTasks
      tags: [tasks]
      summary: List tasks for a matter
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tasks list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

    post:
      operationId: addMatterTask
      tags: [tasks]
      summary: Create a task
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /matters/{matterId}/tasks/{id}:
    patch:
      operationId: updateMatterTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

    delete:
      operationId: deleteMatterTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List the authenticated staff user's global task queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Global task queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task from the global queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlobalTaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task from the global queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  # ─── CONFLICT CHECK ──────────────────────────────────────────────────────────
  /conflicts/check:
    post:
      operationId: runConflictCheck
      tags: [conflicts]
      summary: Run a conflict check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictCheckInput"
      responses:
        "200":
          description: Conflict check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictCheckResult"

  /conflicts/{id}/review:
    post:
      operationId: reviewConflict
      tags: [conflicts]
      summary: Partner review of a conflict check
      parameters:
        - name: id
          in: path
          required: true
