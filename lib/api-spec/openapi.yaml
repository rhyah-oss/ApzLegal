          description: Updated provider operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderOperation"
        "400":
          description: Invalid provider status update
        "403":
          description: Provider confirmation requires a trusted provider adapter
        "404":
          description: Provider operation not found
        "409":
          description: Provider event or operation conflicts with existing state

