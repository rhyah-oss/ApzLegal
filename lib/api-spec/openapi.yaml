  /provider-operations/{id}/status:
    post:
      operationId: updateProviderOperationStatus
      tags: [provider-operations]
      summary: Record a provider operation failure
      description: Records a verified failure reported by an authorized legal staff session. The provider_confirmed state is reserved for a trusted provider adapter and is rejected by this session-authenticated route.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
