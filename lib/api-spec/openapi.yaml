    ProviderOperation:
      type: object
      required: [id, kind, status, idempotencyKey, providerName, payload, attempt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [email, signature]
        status:
          type: string
          enum: [queued, provider_confirmed, failed]
        idempotencyKey:
          type: string
        providerName:
          type: string
        providerRequestId:
          type: ["string", "null"]
        providerEventId:
          type: ["string", "null"]
        matterId:
          type: ["integer", "null"]
        documentId:
          type: ["integer", "null"]
        payload:
          type: object
          additionalProperties: true
        errorMessage:
          type: ["string", "null"]
        attempt:
          type: integer
        retryOfId:
          type: ["integer", "null"]
        reviewedById:
          type: ["integer", "null"]
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        createdById:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProviderEmailInput:
      type: object
      required: [to, subject, body, matterId, reviewed]
      properties:
        to:
          type: string
        cc:
          type: string
        subject:
          type: string
        body:
          type: string
        matterId:
          type: integer
        documentId:
          type: integer
        reviewed:
          type: boolean
          enum: [true]
        reviewNote:
          type: string
        idempotencyKey:
          type: string

    ProviderStatusUpdateInput:
      type: object
      required: [status, providerName, providerEventId]
      properties:
        status:
          type: string
          enum: [failed]
        providerName:
          type: string
        providerRequestId:
          type: string
        providerEventId:
          type: string
        errorMessage:
          type: string
