          required: true
          schema: { type: integer }
        - name: emailId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Email detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailDetail" }

  /matters/{matterId}/emails/{emailId}/read:
    patch:
      operationId: markMatterEmailReadForMatter
      tags: [email]
      summary: Mark an authorised Matter email read or unread
      parameters:
        - name: matterId
          in: path
          required: true
          schema: { type: integer }
        - name: emailId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isRead]
              properties:
                isRead: { type: boolean }
      responses:
        "200":
          description: Updated email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Email" }

  /matters/{matterId}/emails/{emailId}/thread:
    get:
      operationId: getMatterEmailThread
      tags: [email]
      summary: Get the authorised Matter email thread
      parameters:
        - name: matterId
          in: path
          required: true
          schema: { type: integer }
        - name: emailId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Email" }

  /matters/{matterId}/emails/{emailId}/link:
    post:
      operationId: linkMatterEmail
      tags: [email]
      summary: Link, move, or deliberately leave an email unlinked
      parameters:
        - name: matterId
          in: path
          required: true
          schema: { type: integer }
        - name: emailId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLinkInput"
      responses:
        "200":
          description: Updated email link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Email" }

  /email-attachments/{attachmentId}:
    get:
      operationId: getEmailAttachment
      tags: [email]
      summary: Securely retrieve an authorised email attachment
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attachment bytes
        "403":
          description: Matter access denied

  /matters/{matterId}/emails/{emailId}/attachments/{attachmentId}/document:
    post:
      operationId: promoteEmailAttachmentToDocument
      tags: [email]
      summary: Create a governed Matter document from a stored email attachment
      parameters:
        - name: matterId
          in: path
          required: true
          schema: { type: integer }
        - name: emailId
          in: path
          required: true
          schema: { type: integer }
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        "201":
          description: Governed document and traceability link
        "200":
          description: Existing governed document returned idempotently

  # ─── MICROSOFT 365 / OAUTH ────────────────────────────────────────────────────
  /microsoft/oauth/authorize:
    get:
      operationId: getMicrosoftOAuthAuthorize
      tags: [microsoft]
      summary: Get Microsoft 365 OAuth authorization URL
      responses:
        "200":
          description: Authorization URL and state
          content:
            application/json:
              schema:
                type: object
                required: [url, state]
                properties:
                  url: { type: string }
                  state: { type: string }

  /microsoft/oauth/callback:
    get:
      operationId: getMicrosoftOAuthCallback
      tags: [microsoft]
      summary: Microsoft OAuth callback
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to app with success or error

  /microsoft/connection:
    get:
      operationId: getMicrosoftConnectionStatus
      tags: [microsoft]
      summary: Get current user Microsoft 365 connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
                  mailboxEmail: { type: ["string", "null"] }
                  displayName: { type: ["string", "null"] }
                  connectedAt: { type: ["string", "null"] }
                  lastSuccessfulCheckAt: { type: ["string", "null"] }
                  lastProviderError: { type: ["string", "null"] }
                  isExpired: { type: boolean }

  /microsoft/disconnect:
    post:
      operationId: disconnectMicrosoft
      tags: [microsoft]
      summary: Disconnect Microsoft 365
      responses:
        "200":
          description: Disconnection confirmed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }

  /microsoft/sync:
    post:
      operationId: triggerMicrosoftSync
      tags: [microsoft]
      summary: Trigger controlled Microsoft 365 email sync
      responses:
        "200":
          description: Sync queued
        "409":
          description: Provider not connected or authentication expired

  # ─── LEGAL RESEARCH ──────────────────────────────────────────────────────────
  /research/sources:
    get:
      operationId: listResearchSources
      tags: [research]
      summary: List available research sources and their availability
      responses:
        "200":
          description: Research sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchSource"

  /research/query:
    post:
      operationId: performResearch
      tags: [research]
      summary: Perform matter-bound legal research across selected sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchInput"
      responses:
        "201":
          description: Research record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRecord"

  /research:
    get:
      operationId: listResearch
      tags: [research]
      summary: List research records, optionally filtered by matter
      parameters:
        - name: matterId
          in: query
          schema:
            type: integer
        - name: savedOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Research records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchRecord"

  /research/{id}:
    get:
      operationId: getResearch
      tags: [research]
      summary: Get a single research record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Research record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRecord"

  /research/{id}/save-to-matter:
    post:
      operationId: saveResearchToMatter
      tags: [research]
      summary: Save a research record to its matter as part of the formal record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved research record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRecord"

  # ─── AUDIT LOGS ──────────────────────────────────────────────────────────────
  /audit-logs/export:
    get:
      operationId: exportAuditLogs
      tags: [audit]
      summary: Export filtered audit log entries as CSV
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV audit export
          content:
            text/csv:
              schema:
                type: string

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: matterId
          in: query
          description: Return all audit entries for a matter, including its documents and AI outputs
          schema:
            type: integer
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /fica/expiring:
    get:
      operationId: listExpiringFicaDocuments
      tags: [fica]
      summary: List active FICA documents expiring within a selected period
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Expiring FICA documents
          content:
            application/json:
              schema:
                type: object
                required: [days, documents]
                properties:
                  days:
                    type: integer
                  documents:
                    type: array
                    items:
                      type: object
                      required: [id, clientId, clientName, type, expiryDate, status, daysRemaining]
                      properties:
                        id: { type: integer }
                        clientId: { type: integer }
                        clientName: { type: string }
                        type: { type: string }
                        expiryDate: { type: string, format: date }
                        status: { type: string }
                        daysRemaining: { type: integer }

  /matters/{matterId}/documents/{id}/signature-certificate:
    get:
      operationId: downloadDocumentSignatureCertificate
      tags: [documents]
      summary: Download signature evidence for a signed document
      parameters:
        - name: matterId
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Downloadable JSON signature certificate
          content:
            application/json:
              schema:
                type: object
                required: [certificateId, generatedAt, document, signature, approval, auditTrail, verification]
                properties:
                  certificateId: { type: string }
                  generatedAt: { type: string, format: date-time }
                  document:
                    type: object
                    required: [id, title, version, matterId]
                    properties:
                      id: { type: integer }
                      title: { type: string }
                      version: { type: integer }
                      matterId: { type: integer }
                  signature:
                    type: object
                    required: [status, signedAt, verifiedBy, verificationRecordedAt]
                    properties:
                      status: { type: string }
                      signedAt: { type: [string, "null"], format: date-time }
                      verifiedBy: { type: [string, "null"] }
                      verificationRecordedAt: { type: [string, "null"], format: date-time }
                      evidence:
                        type: object
                        required: [signerName, signerEmail, signerMethod, signedVersion, documentSha256, recordedById, recordedByName, recordedAt, evidenceSeal, sealAlgorithm]
                        properties:
                          signerName: { type: string }
                          signerEmail: { type: string, pattern: '^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$' }
                          signerMethod: { type: string }
                          signedVersion: { type: integer }
                          documentSha256: { type: string }
                          recordedById: { type: integer }
                          recordedByName: { type: string }
                          recordedAt: { type: string, format: date-time }
                          evidenceSeal: { type: string }
                          sealAlgorithm: { type: string }
                  approval:
                    type: object
                    required: [status, approvedAt, approvedBy]
                    properties:
                      status: { type: string }
                      approvedAt: { type: [string, "null"], format: date-time }
                      approvedBy: { type: [string, "null"] }
                  auditTrail:
                    type: array
                    items:
                      type: object
                      required: [timestamp, action, actor, details, ipAddress]
                      properties:
                        timestamp: { type: string, format: date-time }
                        action: { type: string }
                        actor: { type: string }
                        details: { type: [string, "null"] }
                        ipAddress: { type: [string, "null"] }
                  verification: { type: string }
        "409":
          description: Document has not been signed

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List staff users for administrators
      responses:
        "200":
          description: Staff users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/matter-pipeline:
    get:
      operationId: getMatterPipeline
      tags: [dashboard]
      summary: Get matter counts by status stage
      responses:
        "200":
          description: Pipeline breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineStage"

  /dashboard/fica-overview:
    get:
      operationId: getFicaOverview
      tags: [dashboard]
      summary: Get FICA compliance overview
      responses:
        "200":
          description: FICA compliance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FicaOverview"

  /dashboard/billing-summary:
    get:
      operationId: getBillingSummary
      tags: [dashboard]
      summary: Get billing and revenue summary
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"

  /dashboard/workload:
    get:
      operationId: getTeamWorkload
      tags: [dashboard]
      summary: Get team workload distribution
      responses:
        "200":
          description: Team workload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadItem"

  /dashboard/personal-work:
    get:
      operationId: getPersonalWork
      tags: [dashboard]
      summary: Get the current user's assigned matters and open tasks
      responses:
        "200":
          description: Personal work summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalWork"

  /microsoft/webhook:
    post:
      operationId: receiveMicrosoftNotification
      tags: [email]
      security: []
      summary: Validate Graph subscription notifications using subscriptionId and clientState
      parameters:
        - in: query
          name: validationToken
          schema:
            type: string
      responses:
        "200":
          description: Plain-text subscription validation token.
        "202":
          description: Batch received; only matching trusted notifications are processed.
        "400":
          description: Malformed notification batch.
  /clients/{id}/compliance:
    patch:
      operationId: updateClientCompliance
      tags: [clients]
      summary: Update compliance fields (compliance roles only, audited)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientComplianceInput"
      responses:
        "200":
          description: Updated client.
        "400":
          description: Invalid fields.
        "403":
          description: Compliance role required.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: auth_token
    bearerSession:
      type: http
      scheme: bearer
      description: Opaque staff session token, not a JWT.
  schemas:
    ClientComplianceInput:
      type: object
      additionalProperties: false
      properties:
        complianceStatus:
          type: string
          enum: [compliant, review_required, blocked]
        complianceBlockReason:
          type: ["string", "null"]
          maxLength: 2000
        riskLevel:
          type: string
          enum: [low, medium, high]
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── AUTH ─────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    DevLoginInput:
      type: object
      required: [role, email, name]
      properties:
        role:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1

    ProfileUpdateInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email

    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 10
          writeOnly: true

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, managing_partner, partner, associate_attorney, candidate_attorney, paralegal, secretary, billing_officer, compliance_officer, client_portal_user]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ─── CLIENT ───────────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, name, type, status, ficaStatus, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [individual, corporate, trust, government]
        status:
          type: string
          enum: [active, inactive, pending]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        idNumber:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        riskScore:
          type: ["integer", "null"]
        ficaStatus:
          type: string
          enum: [compliant, pending, expired, blocked]
        companyRegistration:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        matterCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClientInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [individual, corporate, trust, government]
        email:
          type: string
        phone:
          type: string
        idNumber:
          type: string
        address:
          type: string
        companyRegistration:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]

    FicaStatus:
      type: object
      required: [clientId, overallStatus, documents]
      properties:
        clientId:
          type: integer
        overallStatus:
          type: string
          enum: [compliant, pending, expired, blocked]
        riskScore:
          type: integer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/FicaDocument"
        nextReviewDate:
          type: ["string", "null"]

    FicaDocument:
      type: object
      required: [id, type, status]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [id_document, passport, proof_of_address, company_registration, beneficial_ownership]
        status:
          type: string
          enum: [verified, pending, expired, missing]
        expiryDate:
          type: ["string", "null"]
        uploadedAt:
          type: ["string", "null"]

    RiskScore:
      type: object
      required: [clientId, score, level, factors]
      properties:
        clientId:
          type: integer
        score:
          type: integer
        level:
          type: string
          enum: [low, medium, high]
        factors:
          type: array
          items:
            type: string

    # ─── MATTER ───────────────────────────────────────────────────────────────
    Matter:
      type: object
      required: [id, reference, title, status, clientId, clientName, createdAt]
      properties:
        id:
          type: integer
        reference:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [lead, conflict_check, approved, active, review, completed, closed, archived]
        riskFlag:
          type: boolean
        riskLevel:
          type: string
          enum: [no_risk, review_required, high_risk, compliance_blocked]
        conflictStatus:
          type: ["string", "null"]
          description: Status of the latest conflict record for this matter (null when no scan has run)
        nextAction:
          type: ["string", "null"]
          description: The next required action to move this matter forward
        clientId:
          type: integer
        clientName:
          type: string
        assignedToId:
          type: ["integer", "null"]
        assignedToName:
          type: ["string", "null"]
        practiceArea:
          type: ["string", "null"]
        value:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MatterInput:
      type: object
      required: [title, clientId]
      properties:
        title:
          type: string
        description:
          type: string
        clientId:
          type: integer
        assignedToId:
          type: integer
        practiceArea:
          type: string
        value:
          type: ["number", "null"]

    MatterUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assignedToId:
          type: ["integer", "null"]
        practiceArea:
          type: string
        value:
          type: ["number", "null"]
        riskFlag:
          type: boolean
        riskLevel:
          type: string
          enum: [no_risk, review_required, high_risk, compliance_blocked]

    MatterAssignee:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        accountStatus:
          type: string

    MatterExportClient:
      type: object
      required: [id, name, type, status, ficaStatus]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        status:
          type: string
        ficaStatus:
          type: string

    MatterExportDocument:
      type: object
      required: [id, title, documentType, status, version, approvalStatus, signatureStatus, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        documentType:
          type: string
        status:
          type: string
        version:
          type: integer
        approvalStatus:
          type: string
        signatureStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MatterExportTask:
      type: object
      required: [id, title, status, priority, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        priority:
          type: string
        dueDate:
          type: ["string", "null"]
        assignedToId:
          type: ["integer", "null"]
        assignedToName:
          type: ["string", "null"]
        createdAt:
          type: string
