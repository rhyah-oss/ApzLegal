        "400":
          description: Empty or invalid audio
        "401":
          description: Authentication required
        "413":
          description: Audio exceeds the maximum request size
        "415":
          description: Unsupported audio media type
        "502":
          description: Speech provider failure
        "503":
          description: Speech provider is not configured
        "504":
